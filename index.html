<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>生日快樂！藍藍</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:
    radial-gradient(circle at top,#263b73,#080b22 70%);
    font-family:"Microsoft JhengHei",sans-serif;
    color:white;
}


/* 星空 */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
    }
    to{
        opacity:1;
    }
}


/* 流星 */

.shooting{
    position:absolute;
    width:120px;
    height:2px;
    background:
    linear-gradient(90deg,white,transparent);
    transform:rotate(-35deg);
    animation:shoot 5s linear infinite;
}

@keyframes shoot{

0%{
    left:100%;
    top:20%;
    opacity:0;
}

20%{
    opacity:1;
}

100%{
    left:-20%;
    top:80%;
    opacity:0;
}

}


/* 主內容 */

.container{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

text-align:center;

}


/* 標題 */

h1{

font-size:55px;
letter-spacing:8px;

text-shadow:
0 0 10px #fff,
0 0 25px gold;

animation:fade 3s;

}


.name{

font-size:45px;
margin-top:20px;

color:#ffe9a8;

}


/* 文字 */

.poem{

margin-top:45px;

font-size:28px;

line-height:2;

letter-spacing:5px;

opacity:0;

animation:
showText 5s forwards;

animation-delay:3s;

}


@keyframes showText{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:none;
}

}


@keyframes fade{

from{
opacity:0;
transform:scale(.7);
}

to{
opacity:1;
transform:scale(1);
}

}



/* 金色粒子 */

.particle{

position:absolute;

width:6px;
height:6px;

background:#ffd86b;

border-radius:50%;

animation:
float 8s linear infinite;

}


@keyframes float{

0%{

transform:
translateY(100vh);

opacity:0;

}

50%{

opacity:1;

}

100%{

transform:
translateY(-20vh);

opacity:0;

}

}


/* 煙火 */

.firework{

position:absolute;

width:8px;
height:8px;

background:gold;

border-radius:50%;

animation:
explode 2s infinite;

}


@keyframes explode{

0%{

transform:scale(1);

opacity:1;

}


100%{

transform:
scale(20);

opacity:0;

}

}



/* 結尾 */

.end{

position:absolute;

bottom:50px;

width:100%;

text-align:center;

font-size:35px;

opacity:0;

animation:
ending 5s forwards;

animation-delay:12s;

text-shadow:
0 0 15px gold;

}


@keyframes ending{

to{
opacity:1;
}

}


</style>

</head>


<body>


<div class="container">

<h1>
🎂 生日快樂！
</h1>

<div class="name">
藍藍
</div>


<div class="poem">

生性高雅顯風範，<br>

日子愜意體康健。<br>

快意人生知音伴，<br>

樂娛生日盡開顏。

</div>

</div>


<div class="end">

20260731<br>

By Laura

</div>



<script>


// 建立星空

for(let i=0;i<120;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDelay=
Math.random()*3+"s";

document.body.appendChild(star);

}



// 流星

setInterval(()=>{

let meteor=document.createElement("div");

meteor.className="shooting";

meteor.style.top=
Math.random()*50+"%";

document.body.appendChild(meteor);


setTimeout(()=>{

meteor.remove();

},5000);


},4000);



// 金色粒子

for(let i=0;i<40;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=
Math.random()*100+"%";

p.style.animationDelay=
Math.random()*8+"s";


document.body.appendChild(p);

}



// 簡易煙火

setInterval(()=>{


let f=document.createElement("div");

f.className="firework";

f.style.left=
Math.random()*100+"%";

f.style.top=
Math.random()*70+"%";


document.body.appendChild(f);


setTimeout(()=>{

f.remove();

},2000);


},2500);



</script>


</body>
</html>
